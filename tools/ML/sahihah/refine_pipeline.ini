PATCH-PROMPT AN CODEX (compare_txt_agains_db.py)

Ziel: Matching-Qualität erhöhen, indem (1) Anchors nicht gleich gewichtet werden (Anchor-“Stärke”/Vektorisierung), (2) Kandidatensuche präziser wird (AND→OR Fallback + Reihenfolge-Precheck), (3) Meta-Noise (Quellen-/Takhrij-Sprache) als negativer Faktor wirkt, (4) n robust gewählt wird (mehrere n testen), (5) Optimierung nicht nur Avg-Score maximiert, sondern auch Coverage (Trefferquote), (6) Performance ohne Qualitätsverlust durch Precompute/Caching (einmal teuer, danach billig), und (7) pandas/duckdb statt sqlite3-Iteration.

WICHTIG:
- Index (Hadith-Nummer aus TXT) bleibt immer VOR Normalisierung gesichert.
- Primärer Vergleich bleibt Matn↔Matn (DB_COL = arabic_matn).
- Stanza/Transformer sind NICHT 1:1 zu implementieren wie in den Beispielen; sie sind Werkzeuge. Wir nutzen sie nur dort, wo sie die Qualität messbar erhöhen, ohne RAM zu sprengen.

================================================================================
0) Architektur: 2-Phasen-Pipeline (für Qualität + wiederholbare günstige Runs)
================================================================================
Phase A (Precompute, einmalig pro DB, disk-basiert):
- Für jede DB in /app/tools/ML/Data/normalized_hadith/*.db:
  - Lade nur DB_ID_COL (hadith_number) und DB_COL (arabic_matn) in pandas.
  - Drop NaNs/leer.
  - Erzeuge matn_norm = normalize(arabic_matn) (nur für Suche/Filter, Original bleibt erhalten).
  - Speichere pro DB eine Parquet-Datei (z.B. /app/tools/sahihah/cache/<dbname>.parquet) mit Spalten:
    [hadith_number (float), arabic_matn (str), matn_norm (str), token_count (int)]
  - Zusätzlich: optional “cheap_tokens” (string-split) NICHT speichern (RAM/Disk explodiert), sondern nur token_count.
- Idee: Danach muss das Skript SQLite kaum noch anfassen. Künftige Runs laden Parquet (schnell) und filtern.

Phase B (Matching-Lauf, pro Hadith):
- Lese in_sittah.txt zeilenweise.
- Parse hadith_id + hadith_text_raw.
- Tokenisiere/normalisiere NUR für Vergleich (nicht für Index).
- Erzeuge gewichtete Anchors (siehe 1).
- Kandidatenfilter via Parquet (duckdb oder pandas) + AND→OR.
- Score Kandidaten (ngram hit_rate + order_ratio + meta penalty + multi-n).
- Schreibe Ergebnisse wie bisher in in_sittah_matches.db.

Begründung: Das teuerste ist I/O + wiederholtes Tokenisieren/SQL Scannen. Ein einmaliger Precompute (Parquet) macht Folge-Läufe massiv günstiger, ohne die Matchinglogik zu vereinfachen.

================================================================================
1) Anchor-Stärke/Vektorisierung (nicht jeder Anchor ist gleich viel wert)
================================================================================
Problem: Ein Anchor mit generischen Wörtern (Funktionswörter, Ehrenformeln, häufige Phrasen) zieht viele irrelevante Kandidaten → False Positives + schlechter Score.

Lösung: Jeder Anchor bekommt einen “Stärke”-Wert (Score/Feature-Vektor), und nur die stärksten Anchors werden für harte Filter genutzt.

Implementiere:
1.1 Token-Gewichte (cheap, RAM-schonend):
- Definiere eine kleine ARABIC_FUNCTION_WORDS Liste (Stopwords/Pronomina/Partikeln) + typische Formelwörter:
  z.B. ["هذا","هذه","ذلك","تلك","الذي","التي","الذين","من","ما","لا","لم","لن","قد","ثم","إذ","إذا","كما","لأن","لذلك","في","على","عن","إلى","مع","كان","كانت","يكون","قال","يقول"]
  (nicht perfekt, aber als Heuristik wirksam).
- Definiere HONORIFICS/FORMULA Regex (kurz, hochpräzise): صلى الله عليه وسلم / رضي الله عنه / رحمه الله / عليه السلام etc.
- token_weight(token):
  - Wenn token matcht HONORIFICS/FORMULA → sehr niedrig (z.B. 0.05)
  - Wenn token in ARABIC_FUNCTION_WORDS → niedrig (z.B. 0.10)
  - Wenn len(token) >= 5 → höher (z.B. 0.8)
  - Wenn token seltene Form (z.B. enthält Hamza/Alif-Varianten nach normalize reduziert, aber Länge bleibt) → normal
  - Default: 0.4–0.6

1.2 Anchor-Features (Vektor):
Für einen Anchor-Text (n Tokens):
- avg_token_weight
- content_token_ratio = Anteil Tokens mit weight>=0.6
- meta_penalty(anchor) (siehe 3) als negatives Signal
- anchor_len_tokens

anchor_strength = (avg_token_weight * 0.55) + (content_token_ratio * 0.35) - (meta_penalty * 0.40)
Clampe auf [0,1].

1.3 Anchor-Generierung:
- Generiere wie geplant mehrere Anchors über den Text verteilt (Start/Mitte/Ende + alle ~25 Tokens bei langen Texten).
- Berechne anchor_strength für jeden Anchor.
- Sortiere Anchors nach strength absteigend.
- Benutze:
  - Top-K “strong anchors” (z.B. K=3) für AND-Filter.
  - Top-M (z.B. M=8–12, abhängig von Länge) für OR-Filter.
- Speichere (optional DEBUG) anchors inkl. strength.

Optionale Qualitätsstufe (Stanza), nur wenn ENABLE_STANZA=1:
- Nutze stanza NUR auf hadith_text_raw (Inputseite), NICHT auf DB-Korpus.
- Wenn stanza verfügbar: erhöhe token_weight für POS in {NOUN, PROPN} und senke für {ADP, PRON, DET, PART}.
Begründung: POS/lemma erhöht Anchor-Qualität stark, aber nur wenn wir es minimal einsetzen (nur Input, nicht DB).

================================================================================
2) Kandidatensuche: AND→OR + Reihenfolge-Precheck (Anchor-Positionslogik)
================================================================================
2.1 Filter-Strategie (pro DB-Parquet):
- AND-Phase: Verwende die 2–3 stärksten Anchors (strong anchors) und verlange, dass ALLE vorkommen.
- Wenn Ergebnis < MIN_CANDS (z.B. 25):
  - OR-Phase: Verwende Top-M Anchors und verlange, dass mindestens 1 vorkommt.
- Wenn OR immer noch zu klein:
  - Fallback: LIMIT N ohne Filter (nur als Notnagel).

2.2 Reihenfolge-Precheck (billig, hilft Qualität):
- Für AND/OR-Kandidaten: prüfe vor dem teuren ngram scoring, ob die starken Anchors in matn_norm in steigender Reihenfolge auftauchen (x vor y vor z).
  - Dazu: finde Indexpositionen via str.find (oder regex search) auf matn_norm.
  - Wenn anchor_i_pos == -1 → fail.
  - Wenn pos nicht strikt steigend → Kandidat abwerten oder verwerfen (z.B. verwerfen in AND-Phase, abwerten in OR-Phase).
Begründung: Das ist ein sehr billiger Ordnungstest, der viele falsche Kandidaten entfernt, noch bevor ngrams berechnet werden.

2.3 Umsetzung ohne sqlite3:
- Lade Parquet pro DB in Worker-Cache (pandas DataFrame oder duckdb Scan).
- Filter via:
  - duckdb: SELECT ... FROM parquet WHERE matn_norm LIKE '%anchor%' AND ...
  - oder pandas: df[df["matn_norm"].str.contains(..., regex=False)] kombiniert als boolean masks.
Begründung: Parquet + duckdb/pandas scan ist reproduzierbar und für wiederholte Runs schneller als SQLite-Iterationen.

================================================================================
3) Meta-Noise als negativer Faktor (reduzierte, relevante Regex)
================================================================================
Wir matchen Matn↔Matn.
Reduziere auf das, was für unseren Fall wirklich stört, hier ist ein startpunkt:

MATN_META_RX (regex Modul, case: Arabic, tolerant für WS):
1) HONORIFICS (sehr häufig, wenig Aussagekraft):
- صلى\s*الله\s*عليه\s*وسلم
- صل(?:ى|ي)\s*الله\s*عليه\s*وسلم
- عليه\s*الصلاة\s*والسلام
- عليه\s*السلام
- عليهم\s*السلام
- رضي\s*الله\s*عنه
- رضي\s*الله\s*عنها
- رضي\s*الله\s*عنهم
- رضوان\s*الله\s*عليه
- رحمه\s*الله
- رحمهم\s*الله
- رحمها\s*الله

2) Optional: sehr generische Matn-Frames, die extrem häufig sind und wenig trennen (NUR wenn du sie wirklich als Noise willst):
- قال\s*رسول\s*الله
- رسول\s*الله
- النبي
- صلى\s*الله\s*عليه\s*وسلم (ist schon oben)

Beispiel (nur HONORIFICS):
MATN_META_RX = regex.compile(rf"""(?xiu)(?: ...honorific patterns... )""", regex.VERBOSE|regex.UNICODE)
durchsuche die datenbanken nach extrem häufigen mustern und füge sie hinzu, um false positives zu reduzieren und rauschen zu minimieren. JEDOCH VORSICHTIG sein, um nicht zu viel legitimen matn-inhalt zu entfernen und der Grund für True negatives zu sein. Nur extremes Rauschen wird als negativer Faktor betrachtet.

meta_penalty(text):
- Zähle Treffer (capped), z.B. cap=10.
- p = 1 - exp(-count / 4.0)  -> [0,1]
meta_negative_factor = 1 - p

Anwendung:
- Nutze meta_penalty auf hadith_text_raw (Inputtext ohne Nummer).
- Verwende penalty als negativer Faktor in der Kandidatenbewertung:
  final_adj = final * meta_negative_factor (multiplikativ, stabil) ODER final_adj = final - (META_STRENGTH*p).
- Empfehlung: multiplikativ (final_adj = final*(1-p)), weil es “weiches” Downweighting ist und nicht harte Schwellen zerbricht.

Begründung: Wenn die Inputzeile viel “meta” enthält, ist sie schlechter als Matn-Anfrage. Dann sollen Treffer weniger hoch gewertet werden, weil solche Zeilen oft mehrere Quellen erwähnen und False Positives triggern.

================================================================================
4) Multi-n / rekursive n-Auswahl (robust gegen kleine Abweichungen)
================================================================================
Statt genau ein n:
- Starte mit n0 = calculate_n_value(...)
- Teste Kandidaten n_set = {n0, n0-1, n0+1} (geklemmt).
- Für jeden Kandidaten berechne score_candidate für jedes n und nimm bestes final (bzw. bestes final_adj).
- Optional: Wenn Text sehr kurz (<=20 Tokens), nur {n0, n0-1}.

Begründung: Ein einziges n kann “zu streng” sein, wenn nur kleine Wortvariationen existieren. Multi-n erhöht Trefferquote, ohne die Schwellen pauschal zu senken.

================================================================================
5) Optimierungsziel (sehr wichtig): Coverage + Qualität, nicht nur Avg-Score
================================================================================
Implementiere in evaluate_params:
- coverage = Anteil Zeilen mit mindestens 1 Match (matches != []) oder best_score >= MIN_ACCEPT_SCORE
- avg_hit = Durchschnitt best_score nur über Trefferzeilen
- objective = 0.65*coverage + 0.35*avg_hit
Speichere:
- best_objective
- best_coverage
- best_avg_hit
- best_params

Begründung: Wir wollen Parameter, die “funktionieren” (Treffer liefern) UND gute Scores liefern. D.H. dass wir im Laufe immer strenger (genau: so streng es geht) in der Bewertung werden (um die besten Parameter zu erhalten) anstatt von Anfang an Kandidaten rauszuschmeissen. Wir gehen also „Vom Groben zum Feinen“ und vermeiden somit das Exploration-Exploitation-Dilemma. 

================================================================================
6) RAM/Performance-Entscheidungen (ohne Qualitätsverlust)
================================================================================
6.1 Stanza – nur für Input-Hadith, nur zur Anchor-Bewertung
Ausgangspunkt im bestehenden Code
Relevante Stellen bei dir sind:
parse_hadith_line
tokenize_words_from_text
choose_anchors
match_one_hadith_all
Aktuell passiert Folgendes:
Der Input-Hadith wird tokenisiert (tokenize_words_from_text)
Daraus werden Anchors gebildet (choose_anchors)
Alle Tokens sind gleichwertig → Problem
Ziel von Stanza hier
👉 Tokens im Input-Hadith klassifizieren, damit wir wissen:
„Dieses Wort trägt Inhalt“
„Dieses Wort ist grammatisch / generisch / schwach“
Konkrete Integration (logisch, nicht als Code)
Schritt 1: Einmalige Analyse pro Hadith
In match_one_hadith_all direkt nach:
hadith_id, hadith_text_raw = parse_hadith_line(raw_line)
kommt logisch:
Wenn ENABLE_STANZA=True und wir diesen hadith_id noch nicht analysiert haben:
Führe einmal nlp(hadith_text_raw)
Extrahiere für jedes Wort:
word.text
word.lemma
word.pos
Beispiel Ergebnis (intern, nicht ausgegeben):
قال        POS=VERB
رسول       POS=NOUN
الله        POS=PROPN
إن          POS=PART
الليل       POS=NOUN
يذهب        POS=VERB
Schritt 2: Speichern (Caching)
Du hast bereits Output-DBs → wir nutzen dieselbe Denkweise.
👉 Lege eine neue Cache-DB oder Tabelle an, z. B.:
Table: stanza_cache
Key: hadith_id
Spalten:
hadith_id
pos_counts (JSON: {NOUN: 12, VERB: 6, PART: 9, …})
content_ratio (float, z. B. NOUN+PROPN / total)
Damit:
Jeder Hadith wird einmal mit Stanza analysiert
Jeder weitere Run ist O(1) Zugriff
Schritt 3: Nutzung für Anchor-Bewertung (entscheidend)
In choose_anchors oder direkt davor:
Für jeden Anchor:
Zerlege Anchor in Tokens
Für jedes Token:
Wenn POS ∈ {NOUN, PROPN} → hoher Wert
Wenn POS ∈ {VERB} → mittel
Wenn POS ∈ {PART, ADP, PRON, DET} → niedrig
👉 Anchor-Stärke wird daraus berechnet
Beispiel:
Anchor: "قال رسول الله"
Tokens:
قال (VERB)        → 0.4
رسول (NOUN)       → 0.9
الله (PROPN)      → 0.9
→ Durchschnitt ≈ 0.73
→ ABER Honorific erkannt → runter auf z. B. 0.45
vs.
Anchor: "الليل والنهار لا يذهبان"
Tokens:
الليل (NOUN)      → 0.9
النهار (NOUN)     → 0.9
يذهبان (VERB)     → 0.4
→ Anchor sehr stark
➡ Nur starke Anchors gehen in AND-Filter
➡ Schwache Anchors höchstens in OR
Warum das sauber ist
Stanza wird nur einmal pro Hadith benutzt
Kein RAM-Explosion
Kein Einfluss auf DB-Skalierung
Maximaler Gewinn bei minimalem Einsatz
6.2 Transformer / Semantik – für entgültige Entscheidungen bei Top-K Kandidaten
Ausgangspunkt im bestehenden Code
In match_one_hadith_all hast du:
final, hit_rate, order_ratio = score_candidate(...)
Danach entscheidest du:
if hit_rate < cp.threshold: continue
if order_ratio < cp.order_threshold: continue
Problem
Manche Kandidaten haben:
ordentliche n-gram Matches
aber sind inhaltlich doch nicht derselbe Hadith
Andere sind semantisch identisch, aber:
kleine Wortumstellungen
Synonyme
Ziel des Transformers hier
Der Transformer soll NICHT:
alle Kandidaten vergleichen ❌
DBs komplett embedden ❌
Er soll NUR:
👉 Bei unsicheren Fällen entscheiden helfen
Konkrete Definition „unsicher“
Nach deinem jetzigen Scoring:
base_score = final
Wir definieren:
Sicher gut: base_score ≥ 0.95 → kein Transformer
Sicher schlecht: base_score < 0.60 → kein Transformer
Graubereich → Transformer erlaubt
Wo genau einsetzen
In match_one_hadith_all, nachdem du alle Kandidaten gesammelt hast:
Sortiere Kandidaten nach base_score
Nimm Top-K (z. B. K=20)
Für jeden dieser Kandidaten:
Prüfe Cache:
(hadith_id, db_path, hadith_number)
Wenn nicht vorhanden:
Transformer auf:
Input-Matn
Kandidaten-Matn
Berechne semantic_similarity ∈ [0,1]
Speichere im Cache (SQLite/Parquet)
Wie fließt das Ergebnis ein?
Nicht ersetzen, sondern modulieren:
Beispiel:
final_adj = base_score * (0.85 + 0.15 * semantic_similarity)
Oder konservativer:
final_adj = base_score + 0.1 * (semantic_similarity - 0.5)
➡ Semantik kann:
gute Kandidaten leicht pushen
falsche leicht runterziehen
➡ Aber nie ein schlechtes n-gram Match retten
Caching (extrem wichtig)
Eigene kleine Cache-DB:
Table: semantic_cache
Spalten:
hadith_id
db_path
src_hadith_number
semantic_score

Damit:
Jeder Vergleich wird einmal gerechnet
Weitere Runs sind billig
Parameter-Suche profitiert massiv davon
Zusammenfassung (klar & knapp)
Stanza
Nur Input-Hadith
Nur POS/Lemma
Nur zur Anchor-Stärke
Einmal rechnen, dauerhaft cachen
Kein Einfluss auf DB-Größe oder Laufzeit-Explosion
Transformer
Nur für Top-K Kandidaten
Nur im Score-Graubereich
Nur als Bonus/Malus
Immer gecached
Qualität ↑ ohne System zu verlangsamen

Hier ein Beispiel für den Transformer-Einsatz (Pseudocode):
(from transformers import pipeline
from arabic_reshaper import reshape
from bidi.algorithm import get_display
import warnings

# Warnungen unterdrücken
warnings.filterwarnings("ignore")

def d(text):
    if not isinstance(text, str):
        return text
    return get_display(reshape(text))

print("Load Model... (Binary Decision Mode)")
# mDeBERTa ist ideal für den direkten semantischen Abgleich
classifier = pipeline("zero-shot-classification", model="MoritzLaurer/mDeBERTa-v3-base-mnli-xnli")

def analyze_matn_match(text_a, text_b):
    # Nur zwei gegensätzliche Pole für maximale Schärfe
    candidate_labels = ["نفس الموضوع", "موضوع مختلف"]
    
    # Klare Hypothese für die KI
    hypothesis_template = "هذان النصان يتحدثان عن {}"
    
    # Texte kombinieren
    combined = f"{text_a} [SEP] {text_b}"
    
    result = classifier(combined, candidate_labels, hypothesis_template=hypothesis_template, multi_label=False)
    
    # Harte Filterregeln (wie 'Dajjal' im Rijal-Skript)
    # Wenn Text B ein neues Kapitel einleitet, ist es ein erzwungener Bruch.
    break_signals = ["باب ", "كتاب ", "فصل "]
    is_new_chapter = any(text_b.startswith(signal) for signal in break_signals)
    
    label = result['labels'][0]
    score = result['scores'][0]
    
    # Manuelle Korrektur bei Struktur-Signalen
    if is_new_chapter and label == "نفس الموضوع":
        label = "موضوع مختلف (Strukturbruch)"
        score = 1.0

    print(f"\nMatn A: {d(text_a)}")
    print(f"Matn B: {d(text_b)}")
    print(f"Urteil: {d(label)} ({score:.2%})")

# --- SCHARFE KONTRAST-PROBE ---
pairs = [
    # 1. Identischer Kern (Zusammengehörig)
    ("بني الإسلام على خمس", "شهادة أن لا إله إلا الله وإقام الصلاة"),
    
    # 2. Völlig anderes Thema (Bruch)
    ("إنما الأعمال بالنيات", "إذا توضأ العبد فغسل وجهه"),
    
    # 3. Struktur-Bruch (Kapitelwechsel)
    ("الطهور شطر الإيمان", "باب فضل الصلاة"),
    
    # 4. Ergänzung (Zusammengehörig)
    ("من غشنا فليس منا", "المكر والخديعة في النار"),
    
    # 5. Räumlich getrennt (Bruch)
    ("أحب البلاد إلى الله مساجدها", "المؤمن يأكل في معاء واحد")
]

for a, b in pairs:
    analyze_matn_match(a, b))

Anweisung zur Architektur:
Setup wird in seperate Modulen gepackt/gebaut, damit Einweg-Elemente nicht das Hauptmodul überladen.  

6.3 DuckDB vs pandas:
- Precompute: pandas liest SQLite → Parquet (einmalig).
- Matching: duckdb scannt Parquet mit LIKE/contains (schnell, weniger RAM), liefert nur Kandidaten-Slice → dann Python scoring.
- duckdb: nimmt pandas an definierten Checkpoints Daten ab um den RAM im Laufe des Runs zu entlasten.
Begründung: duckdb ist gut für “window/aggregation/scan” ohne alles in RAM zu ziehen. Pandas ist gut für Transformation/Precompute und für kleine Kandidatenmengen.

================================================================================
7) Implementations-Checklist (Code-Patch im Modul)
================================================================================
- Neue Config-Flags:
  - CACHE_DIR, USE_DUCKDB, ENABLE_STANZA, ENABLE_SEM_RERANK, DEBUG
  - MIN_CANDS, MIN_ACCEPT_SCORE, META_STRENGTH, TOPK_RERANK
- Precompute-Funktion:
  - build_parquet_cache_if_missing(db_paths)
- Worker init:
  - Lade Parquet handles / duckdb connection
- Ersetze fetch_candidates durch pandas/duckdb Candidate-Slice:
  - returns rows: [(hadith_number, matn_norm, arabic_matn)] oder DataFrame
- Implementiere anchor_strength + select_strong_anchors
- AND→OR Filter + Reihenfolge-Precheck (anchor positions increasing)
- Multi-n scoring
- Meta-penalty integriert in final_adj
- evaluate_params/recursive_search: objective statt mean(best_score)
- Output DB bleibt identisch (json Listen), score soll final_adj sein.
Implementierung eines Logging- & Visualisierungs-Moduls für die Prozess-Analyse
Erstelle ein Python-Modul, das den Evaluierungsprozess sowohl textbasiert (Konsole) als auch visuell (Matplotlib) aufbereitet.
1. Strukturiertes Debug-Logging
Aktivierung: Logs werden nur ausgegeben, wenn die Umgebungsvariable DEBUG=1 gesetzt ist.
Ästhetik: Nutze Trennlinien, Überschriften und Icons (z. B. ⚓, 🔍, 💾), um eine klare Hierarchie zu schaffen.
Inhaltlicher Fokus:
Anchors: Identifizierte Ankerpunkte im Text.
Kandidaten-Flow: Dokumentation der Trefferanzahl vor und nach den Filterphasen.
Cache-Performance: Ausweisung der Cache-Trefferquote zur Effizienzmessung.
Impact-Analyse: Wie beeinflussen die aktuellen Parameter das Gesamtergebnis (Objective)?
Traceability: Der Output muss als detaillierter Traceback dienen, um logische Fehler im Prozess sofort sichtbar zu machen.
2. Multi-Szenario Visualisierung (Matplotlib)
Entwickle eine Funktion, die die Entwicklung der hit_rate (Coverage) grafisch darstellt:
Dimensionen: Vergleich unterschiedlicher Szenarien (z. B. verschiedene Parametersätze).
Darstellung: Ein Liniendiagramm, das zeigt, wie sich die Trefferrate über die Zeit/Iterationen verändert.
Features: Automatisches Labelling der Achsen, Legende für die Parameter-Konfigurationen und ein sauberes Grid-Layout.

