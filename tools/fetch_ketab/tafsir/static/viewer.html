<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تخريج أحاديث تفسير ابن كثير</title>

<style>
    .block { position: relative; border-bottom: 2px solid #eee; padding: 20px; }
    .block-meta { display: flex; gap: 10px; margin-bottom: 10px; font-size: 0.8em; }
    .source-badge { background: #e0f7fa; color: #006064; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    .id-badge { color: #999; }
    .hadith-section { margin-top: 15px; padding: 10px; background: #494737; border-right: 4px solid #fbc02d; font-size: 0.9em; }
    .hadith-section ul { margin: 5px 0 0 0; padding-right: 20px; }
    mark { background: #ffeb3b; color: #000; padding: 0 2px; }
:root{
  --bg:#0b0f14;
  --panel:#0f1720;
  --ink:#e7d9b8;
  --muted:#a7a7a7;
  --border:rgba(215,180,106,.22);
  --shadow: 0 10px 24px rgba(0,0,0,.35);
  --accent:#d7b46a;
  --highlight-bg:#ffd54f;
  --highlight-ink:#1c1300;
}

body{
  margin:0;
  font-family:"Amiri","Scheherazade New","Noto Naskh Arabic",serif;
  background:var(--bg);
  color:var(--ink);
  line-height:2;
  padding-top: 180px; /* Platz für den fixierten Header */
}

body.light{
  --bg:#f7f7f7;
  --panel:#ffffff;
  --ink:#101010;
  --muted:#555;
  --border:#ddd;
  --shadow: 0 6px 14px rgba(0,0,0,.12);
  --accent:#8a6d1d;
  --highlight-bg:#ffca28;
  --highlight-ink:#1c1300;
}

.light .hadith-section {
  color:whitesmoke;
}

header{
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;
  transition: all 0.28s ease;
  backdrop-filter: blur(8px);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  border-bottom: 1px solid var(--border);
  padding: 14px 0;
}

.header-inner{
  max-width: 980px;
  margin: 0 auto;
  padding: 14px 16px 16px;
  display: grid;
  gap: 10px;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 12px;
}

.mode-row{
  display:flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
}

#search {
  width: 100%;
  margin: 8px 0 4px;
}

header.scrolled {
  padding: 6px 0;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
}

header.scrolled .header-inner{
  padding: 8px 14px;
  display:flex;
  align-items:center;
  gap: 10px;
  flex-wrap: nowrap;
}

header.scrolled .title-row{
  flex: 0 0 auto;
  gap: 8px;
  max-width: 260px;
}

@media (max-width: 880px){
  header.scrolled .header-inner{
    flex-wrap: wrap;
    row-gap: 6px;
  }
}

header.scrolled h1 {
  font-size: 16px;
  margin: 0;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

header.scrolled #search {
  flex: 1 1 260px;
  max-width: 380px;
  min-width: 200px;
  margin: 0;
}

header.scrolled input[type="text"]{
  padding: 8px 10px;
  font-size: 14px;
}

header.scrolled .mode-row {
  flex: 0 0 auto;
  gap: 8px;
  margin: 0;
  flex-wrap: nowrap;
  justify-content: flex-start;
}

header.scrolled .mode-row .controls{
  flex-wrap: nowrap;
  gap: 6px;
}

header.scrolled .btn{
  padding: 6px 10px;
  font-size: 13px;
}

header.scrolled .badge{
  font-size: 12px;
  white-space: nowrap;
}

header.scrolled .small {
  display: none;
}

h1{
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
}

.controls{
  display:flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

input[type="text"]{
  width: 100%;
  box-sizing: border-box;
  padding: 10px 12px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--ink);
  outline: none;
}

.btn{
  padding: 9px 12px;
  font-size: 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
}

.btn.primary{
  border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
}

.btn:disabled{
  opacity: .6;
  cursor: not-allowed;
}

.badge{
  font-size: 13px;
  color: var(--muted);
}

#container{
  max-width: 980px;
  margin: 18px auto 120px;
  padding: 0 14px;
}

.block{
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 14px 14px;
  margin: 14px 0;
  white-space: pre-wrap;
}

.block-meta{
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
  font-size: 0.92em;
  flex-wrap: wrap;
}

.block-meta .meta-left,
.block-meta .meta-right{
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.block.hidden{
  display:none !important;
}

.ayah-pill{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 16%, var(--panel));
  border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border));
  color: var(--ink);
  box-shadow: 0 4px 12px rgba(0,0,0,.18);
  font-weight: 700;
}

.ayah-pill .pill-sub{
  color: var(--muted);
  font-weight: 600;
}

.ayah-pill.secondary{
  background: color-mix(in srgb, var(--panel) 85%, var(--accent));
  border-color: color-mix(in srgb, var(--accent) 30%, var(--border));
  font-weight: 600;
}

.ayah-text{
  margin: 4px 0 10px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px dashed var(--border);
  background: color-mix(in srgb, var(--panel) 75%, transparent);
  color: var(--ink);
  line-height: 1.8;
  font-size: 0.98em;
}

mark,
.highlight-hit{
  background: var(--highlight-bg);
  color: var(--highlight-ink);
  padding: 0 .18em;
  border-radius: .2em;
  font-weight: 700;
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--highlight-bg) 35%, transparent);
  text-decoration: none;
}

#loader{
  text-align: center;
  padding: 22px 10px;
  color: var(--muted);
}

.small{
  font-size: 13px;
  color: var(--muted);
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="title-row">
      <h1>تخريج أحاديث تفسير ابن كثير</h1>
      <div class="controls">
        <button id="themeToggle" class="btn" title="Light/Dark">🌓</button>
      </div>
    </div>

    <input id="search" type="text" placeholder="🔍 ابحث عبر خادم FastAPI…" />

    <div class="mode-row">
      <div class="controls">
        <button id="clearSearch" class="btn">مسح البحث</button>
        <button id="toggleHighlight" class="btn primary">تمييز النتائج: تشغيل</button>
        <button id="globalSearchBtn" class="btn" title="تنفيذ البحث الآن عبر الخادم">بحث عبر الخادم</button>
      </div>
      <div class="badge" id="status">جاهز</div>
    </div>

    <div class="small">
      البيانات والبحث يمران عبر خادم FastAPI.
    </div>
  </div>
</header>

<div id="container"></div>
<div id="loader">… جاري التحميل …</div>

<script>
/* =============================
   CONFIG
============================= */
const API_BASE = "";               // استخدم نفس الأصل (يمكن تغييرها عند الحاجة)
const PAGE_SIZE = 24;              // كمية القراءة التدريجية
const SEARCH_LIMIT = 80;           // حد نتائج البحث
const SCROLL_THRESHOLD = 800;      // متى نحمل الصفحة التالية

/* =============================
   STATE
============================= */
let mode = "read";         // "read" | "search"
let offset = 0;
let totalBlocks = 0;
let reachedEnd = false;
let loading = false;
let highlightOn = true;
let searchTimer = null;
let currentQuery = "";

let loadedNodes = [];      // { el, rawText }

/* =============================
   ELEMENTS
============================= */
const container = document.getElementById("container");
const loader = document.getElementById("loader");
const statusEl = document.getElementById("status");

const searchInput = document.getElementById("search");
const clearBtn = document.getElementById("clearSearch");
const themeToggle = document.getElementById("themeToggle");
const toggleHighlightBtn = document.getElementById("toggleHighlight");
const globalSearchBtn = document.getElementById("globalSearchBtn");

/* =============================
   UTILS
============================= */
function setStatus(msg){ statusEl.textContent = msg; }

function escapeHtml(s){
  return s.replace(/&/g,"&amp;")
          .replace(/</g,"&lt;")
          .replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;")
          .replace(/'/g,"&#39;");
}

function highlight(text, q){
  if (!highlightOn || !q) return escapeHtml(text);
  const terms = q.split(/\s+/).filter(Boolean);
  if (!terms.length) return escapeHtml(text);
  const safe = escapeHtml(text);
  const pattern = terms.map(escapeRegExp).join("|");
  const re = new RegExp(pattern, "gi");
  return safe.replace(re, (m)=>`<span class="highlight-hit">${m}</span>`);
}

function escapeRegExp(s){
  return s.replace(/[-/\\^$*+?.()|[\\]{}]/g, "\\$&");
}

/* =============================
   THEME
============================= */
if (localStorage.getItem("theme") === "light") {
  document.body.classList.add("light");
}
themeToggle.onclick = () => {
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
};

/* =============================
   FETCH HELPER
============================= */
async function fetchJSON(url){
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok){
    const text = await res.text().catch(() => res.statusText);
    throw new Error(text || res.statusText);
  }
  return res.json();
}

/* =============================
   RENDER
============================= */
function appendBlock(obj, { replace = false } = {}){
  if (replace){
    container.innerHTML = "";
    loadedNodes = [];
  }

  const div = document.createElement("div");
  div.className = "block";
  div.dataset.id = obj.id ?? "";

  const suraNumber = obj.sura_number ?? obj.sura;
  const suraName = obj.sura_name ?? "";
  const ayahNumber = obj.ayah_number ?? obj.aya;
  const ayahText = obj.ayah_text ?? obj.aya_text;

  const suraBadge = suraNumber
    ? `<span class="ayah-pill">سورة ${escapeHtml(suraName || "")} <span class="pill-sub">(${suraNumber})</span></span>`
    : "";
  const ayahBadge = ayahNumber ? `<span class="ayah-pill secondary">آية ${ayahNumber}</span>` : "";
  const ayahTextHtml = ayahText ? `<div class="ayah-text">${escapeHtml(ayahText)}</div>` : "";
  
  // Hadithe formatieren
  let hadithsHtml = "";
  if(obj.hadiths && obj.hadiths.length > 0) {
    hadithsHtml = `<div class="hadith-section"><strong>المصادر الحديثية:</strong><ul>${obj.hadiths.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ul></div>`;
  }

  div.innerHTML = `
    <div class="block-meta">
      <div class="meta-left">
        ${suraBadge}
        ${ayahBadge}
      </div>
      <div class="meta-right">
        <span class="source-badge">المصدر: ${obj.source || 'غير معروف'}</span>
        <span class="id-badge">ID: ${obj.id}</span>
      </div>
    </div>
    ${ayahTextHtml}
    <div class="content-text">${escapeHtml(obj.text)}</div>
    ${hadithsHtml}
  `;
  container.appendChild(div);

  // Wichtig für das Highlight-Refreshen
  loadedNodes.push({
    el: div.querySelector(".content-text"),
    rawText: obj.text,
  });
}

function refreshHighlights(){
  const q = mode === "search" ? currentQuery : "";
  for (const n of loadedNodes){
    n.el.innerHTML = highlight(n.rawText, q);
  }
}

/* =============================
   HEALTH + LOADING
============================= */
async function checkHealth(){
  try {
    const data = await fetchJSON(`${API_BASE}/health`);
    totalBlocks = data.total_blocks ?? totalBlocks;
    setStatus(`جاهز — إجمالي: ${totalBlocks}`);
    return true;
  } catch (err){
    loader.textContent = "❌ الخادم غير متاح";
    setStatus("خطأ في الاتصال");
    console.error(err);
    return false;
  }
}

async function loadNextPage(){
  if (mode !== "read" || loading || reachedEnd) return;
  loading = true;
  loader.textContent = "… جاري التحميل …";

  try {
    const url = `${API_BASE}/api/blocks?` + new URLSearchParams({ offset, limit: PAGE_SIZE });
    const data = await fetchJSON(url);
    totalBlocks = data.total ?? totalBlocks;

    if (!Array.isArray(data.results) || data.results.length === 0){
      reachedEnd = true;
      loader.textContent = "✓ انتهى";
      setStatus(`تم تحميل الكل: ${totalBlocks || offset}`);
      return;
    }

    for (const item of data.results) appendBlock(item);

    offset += data.results.length;
    reachedEnd = offset >= (data.total ?? offset);
    loader.textContent = reachedEnd ? "✓ انتهى" : "… جاري التحميل …";
    setStatus(`محمل: ${offset} / ${data.total ?? "?"}`);
  } catch (err){
    loader.textContent = "❌ خطأ في تحميل البيانات";
    setStatus("خطأ");
    console.error(err);
  } finally {
    loading = false;
  }
}

function onScroll(){
  if (mode !== "read") return;
  if (window.innerHeight + window.scrollY >= document.body.scrollHeight - SCROLL_THRESHOLD){
    loadNextPage();
  }
}

/* =============================
   SEARCH (via FastAPI)
============================= */
async function runSearch(query){
  const q = (query || "").trim();
  currentQuery = q;

  if (q.length < 2){
    await resetReader();
    return;
  }

  mode = "search";
  loader.textContent = "… جاري البحث عبر الخادم …";
  setStatus("بحث عبر FastAPI…");

  try {
    const url = `${API_BASE}/api/search?` + new URLSearchParams({ q, limit: SEARCH_LIMIT });
    const data = await fetchJSON(url);
    renderResults(data);
  } catch (err){
    loader.textContent = "❌ فشل البحث";
    setStatus("خطأ في البحث");
    console.error(err);
  }
}

function renderResults(data){
  const items = Array.isArray(data.results) ? data.results : [];
  container.innerHTML = "";
  loadedNodes = [];

  for (const item of items) appendBlock(item);
  refreshHighlights();

  loader.textContent = `✓ نتائج: ${items.length} من ${data.total ?? items.length}`;
  setStatus(`بحث: ${data.total ?? items.length} (cache: ${data.cached ? "نعم" : "لا"}) — ${data.took_ms ?? "?"}ms`);
}

async function resetReader(){
  if (mode === "read"){
    currentQuery = "";
    refreshHighlights();
    return;
  }

  mode = "read";
  currentQuery = "";
  offset = 0;
  reachedEnd = false;
  container.innerHTML = "";
  loadedNodes = [];
  loader.textContent = "… جاري التحميل …";
  await loadNextPage();
}

/* =============================
   EVENTS
============================= */
searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(searchInput.value), 200);
});

clearBtn.onclick = () => {
  searchInput.value = "";
  runSearch("");
};

toggleHighlightBtn.onclick = () => {
  highlightOn = !highlightOn;
  toggleHighlightBtn.textContent = `تمييز النتائج: ${highlightOn ? "تشغيل" : "إيقاف"}`;
  refreshHighlights();
};

globalSearchBtn.onclick = () => runSearch(searchInput.value);

/* =============================
   INIT
============================= */
(async function init(){
  setStatus("الاتصال بالخادم…");

  const ok = await checkHealth();
  if (!ok) return;

  await loadNextPage();
  window.addEventListener("scroll", onScroll);
})();
/*
================================
HEADER
================================
*/
const headerEl = document.querySelector('header');
function updateHeaderMode(){
  headerEl.classList.toggle('scrolled', window.scrollY > 50);
}
window.addEventListener('scroll', updateHeaderMode);
updateHeaderMode();
</script>


</body>
</html>
